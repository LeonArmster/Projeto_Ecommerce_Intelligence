version: 2

models:

  # ============================================================
  # CUSTOMERS
  # ============================================================
  - name: stg_customers
    description: >
      Cadastro de clientes padronizado a partir da camada raw.
      Mantém uma linha por cliente.

    columns:

      - name: customer_id
        description: "Identificador único do cliente."
        data_tests:
          - not_null
          - unique

      - name: birth_date
        description: "Data de nascimento do cliente."
        data_tests:
          - not_null

      - name: state
        description: "UF associada ao cliente."
        data_tests:
          - not_null

      - name: created_at
        description: "Data e hora de criação do cadastro do cliente."
        data_tests:
          - not_null


  # ============================================================
  # PRODUCTS
  # ============================================================
  - name: stg_products
    description: >
      Catálogo de produtos padronizado a partir da camada raw.
      Mantém uma linha por produto.

    columns:

      - name: product_id
        description: "Identificador único do produto."
        data_tests:
          - not_null
          - unique

      - name: category
        description: "Categoria comercial do produto."
        data_tests:
          - not_null

      - name: brand
        description: "Marca do produto."
        data_tests:
          - not_null

      - name: base_price
        description: "Preço base cadastrado para o produto."
        data_tests:
          - not_null

      - name: weight_kg
        description: "Peso do produto em quilogramas."
        data_tests:
          - not_null


  # ============================================================
  # ORDERS
  # ============================================================
  - name: stg_orders
    description: >
      Pedidos realizados pelos clientes, padronizados a partir
      da camada raw. Mantém uma linha por pedido.

    columns:

      - name: order_id
        description: "Identificador único do pedido."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identificador do cliente responsável pelo pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_at
        description: "Data e hora de realização do pedido."
        data_tests:
          - not_null

      - name: order_status
        description: "Status atual do pedido."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - processing
                  - cancelled

      - name: shipping_type
        description: "Modalidade de entrega selecionada para o pedido."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - economy
                  - standard
                  - express


  # ============================================================
  # ORDER ITEMS
  # ============================================================
  - name: stg_order_items
    description: >
      Itens pertencentes aos pedidos, padronizados a partir
      da camada raw. Mantém uma linha por item de pedido.

    columns:

      - name: order_item_id
        description: "Identificador único do item do pedido."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identificador do pedido ao qual o item pertence."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: "Identificador do produto associado ao item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: "Quantidade do produto comprada no item."
        data_tests:
          - not_null

      - name: unit_price
        description: "Preço unitário praticado no momento da compra."
        data_tests:
          - not_null

      - name: discount_pct
        description: "Percentual de desconto aplicado ao item."
        data_tests:
          - not_null


  # ============================================================
  # PAYMENTS
  # ============================================================
  - name: stg_payments
    description: >
      Informações de pagamento dos pedidos, padronizadas a partir
      da camada raw. Mantém uma linha por pagamento.

    columns:

      - name: payment_id
        description: "Identificador único do pagamento."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identificador do pedido relacionado ao pagamento."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_method
        description: "Meio de pagamento utilizado."
        data_tests:
          - not_null

      - name: payment_amount
        description: "Valor associado ao pagamento."
        data_tests:
          - not_null

      - name: installments
        description: "Quantidade de parcelas do pagamento."
        data_tests:
          - not_null

      - name: payment_status
        description: "Status do processamento do pagamento."
        data_tests:
          - not_null

      - name: paid_at
        description: "Data e hora de confirmação do pagamento."


  # ============================================================
  # SHIPMENTS
  # ============================================================
  - name: stg_shipments
    description: >
      Informações logísticas dos pedidos enviados, padronizadas
      a partir da camada raw. Mantém uma linha por envio.

    columns:

      - name: shipment_id
        description: "Identificador único do envio."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identificador do pedido associado ao envio."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: shipped_at
        description: "Data e hora de despacho do pedido."
        data_tests:
          - not_null

      - name: estimated_delivery_at
        description: "Data e hora estimadas para entrega."
        data_tests:
          - not_null

      - name: delivered_at
        description: "Data e hora efetivas da entrega."


  # ============================================================
  # REVIEWS
  # ============================================================
  - name: stg_reviews
    description: >
      Avaliações realizadas pelos clientes após os pedidos,
      padronizadas a partir da camada raw.
      Mantém uma linha por avaliação.

    columns:

      - name: review_id
        description: "Identificador único da avaliação."
        data_tests:
          - not_null
          - unique

      - name: order_id
        description: "Identificador do pedido avaliado."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: rating
        description: "Nota atribuída pelo cliente ao pedido, de 1 a 5."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5

      - name: reviewed_at
        description: "Data e hora de criação da avaliação."
        data_tests:
          - not_null