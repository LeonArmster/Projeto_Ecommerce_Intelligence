
version: 2

models:
  - name: fct_order_items
    description: >
      Tabela fato de itens de pedidos.
      Granularidade de uma linha por order_item_id.
      Contém medidas financeiras e chaves para
      relacionamento com as dimensões.

    columns:
      - name: order_item_id
        description: "Identificador único do item."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identificador do pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        description: "Identificador do produto."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Identificador do cliente."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date_key
        description: "Chave da dimensão calendário."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity
        data_tests:
          - not_null

      - name: gross_amount
        data_tests:
          - not_null

      - name: discount_amount
        data_tests:
          - not_null

      - name: net_amount
        data_tests:
          - not_null
