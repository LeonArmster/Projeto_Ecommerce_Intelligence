
version: 2

models:
  - name: mart_customer_360
    description: >
      Visão analítica consolidada por cliente.
      Uma linha por customer_id, incluindo clientes
      que ainda não realizaram compras.

    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: total_orders
        data_tests:
          - not_null

      - name: completed_orders
        data_tests:
          - not_null

      - name: lifetime_revenue
        data_tests:
          - not_null

      - name: is_repeat_customer
        description: "True when the customer has at least two completed orders."
        data_tests:
          - not_null

      - name: days_to_second_purchase
        description: "Calendar days between the first and second completed purchases; null for customers with fewer than two."

      - name: purchase_frequency_per_month
        description: "Completed orders per 30 calendar days since the first completed purchase through the reference date; null if no eligible purchase."

      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - no_purchase
                  - future_purchase
                  - new_customer
                  - active_repeat
                  - at_risk
                  - inactive



  - name: mart_customer_cohort_retention
    description: >
      Retencao mensal por coorte de primeira compra concluida.
      Uma linha por cohort_month e activity_month, inclusive meses sem recompra.
      O mes M0 representa 100% dos clientes da coorte.
      O periodo termina em customer_reference_date (padrao: data da execucao dbt).
      O mes corrente pode estar incompleto.
    columns:
      - name: cohort_month
        data_tests:
          - not_null
      - name: activity_month
        data_tests:
          - not_null
      - name: months_since_first_purchase
        data_tests:
          - not_null
      - name: cohort_customers
        data_tests:
          - not_null
      - name: active_customers
        data_tests:
          - not_null
      - name: retention_rate_pct
        data_tests:
          - not_null


  - name: mart_product_performance
    description: >
      Mart de performance comercial de produtos.
      Granularidade de uma linha por product_id,
      incluindo produtos sem vendas concluídas.

    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: total_orders
        data_tests:
          - not_null

      - name: completed_orders
        data_tests:
          - not_null

      - name: units_sold
        data_tests:
          - not_null

      - name: gross_revenue
        data_tests:
          - not_null

      - name: discount_amount
        data_tests:
          - not_null

      - name: net_revenue
        data_tests:
          - not_null

      - name: average_selling_price
        data_tests:
          - not_null




  - name: mart_logistics_performance
    description: >
      Indicadores logísticos mensais por modalidade
      de frete, com base no mês de expedição.

    columns:
      - name: shipment_month
        data_tests:
          - not_null

      - name: shipping_type
        data_tests:
          - not_null

      - name: total_shipments
        data_tests:
          - not_null

      - name: delivered_shipments
        data_tests:
          - not_null

      - name: pending_shipments
        data_tests:
          - not_null

      - name: late_deliveries
        data_tests:
          - not_null

      - name: on_time_deliveries
        data_tests:
          - not_null

      - name: overdue_pending_shipments
        data_tests:
          - not_null
